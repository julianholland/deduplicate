[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "deduplicate_lib"
dynamic = ["version"]
description = "Deduplication of numpy vector arrays, with automatic tolerance tuning."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Julian Holland", email = "holland@fhi.mpg.de"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "numba",
    "scipy",
]

[project.optional-dependencies]
# An extra (not a dependency group) so Read the Docs can install it.
docs = [
    "sphinx>=7",
    "furo",
    "sphinx-autodoc-typehints",
]

# Development-only dependencies (PEP 735). `uv sync` installs the `dev`
# group by default; never part of the published package.
[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    # tests/integration/test_example_notebook.py executes examples/*.ipynb
    "nbconvert",
    "nbclient",
    "notebook",
    "ipykernel",
    "matplotlib",
]
dev = [
    { include-group = "test" },
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/julianholland/deduplicate"
Repository = "https://github.com/julianholland/deduplicate"

# Version from git tags (vMAJOR.MINOR.PATCH; older bare MAJOR.MINOR.PATCH tags
# are read too).
[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "post-release", local_scheme = "no-local-version" }

# Written at build/install time; read by deduplicate_lib.__init__ (not tracked).
[tool.hatch.build.hooks.vcs]
version-file = "src/deduplicate_lib/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deduplicate_lib"]

[tool.hatch.build.targets.sdist]
include = [
    "src/deduplicate_lib",
    "tests",
    "examples",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = ["**/__pycache__", "docs/_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

# Enable linting rules
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
    "B905",  # zip() without an explicit strict= parameter
    "UP007", # Use X | Y for type annotations (Python 3.10+)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]  # Allow unused arguments and assert statements in tests
"__init__.py" = ["F401"]     # Allow unused imports in __init__.py files

[tool.ruff.lint.isort]
known-first-party = ["deduplicate_lib"]
force-single-line = false
split-on-trailing-comma = true

[tool.ruff.format]
# Code samples in Markdown are left alone.
exclude = ["*.md"]

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/deduplicate_lib/version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
